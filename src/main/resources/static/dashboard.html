<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { display: flex; background: #f4f7f6; }
        
        /* Sidebar Design */
        .sidebar { width: 250px; height: 100vh; background: #2c3e50; color: white; padding: 20px; position: fixed; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; }
        .sidebar a { display: block; color: white; text-decoration: none; padding: 15px; margin-bottom: 10px; border-radius: 5px; transition: 0.3s; }
        .sidebar a:hover { background: #34495e; }
        .active { background: #3498db !important; }

        /* Main Content Design */
        .main-content { margin-left: 250px; width: 100%; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Stats Cards */
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #3498db; }
        .card h3 { color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .card p { font-size: 24px; font-weight: bold; margin-top: 10px; }

        /* Table Design */
        .table-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #333; }
        .btn-add { background: #27ae60; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>EMS Admin</h2>
        <a href="dashboard.html" class="active">🏠 Dashboard</a>
        <a href="index.html">👥 Employees</a>
        <a href="add-employee.html">➕ Add New</a>
        <a href="login.html" style="margin-top: 50px; color: #e74c3c;">🚪 Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Welcome, Admin</h1>
            <a href="add-employee.html" class="btn-add">+ Add Employee</a>
        </div>

        <div class="stats">
            <div class="card">
                <h3>Total Employees</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="card" style="border-left-color: #e67e22;">
                <h3>Active Projects</h3>
                <p>12</p>
            </div>
            <div class="card" style="border-left-color: #9b59b6;">
                <h3>New Requests</h3>
                <p>5</p>
            </div>
        </div>

        <div class="table-container">
            <h3>Recent Employees</h3><br>
            <table id="recentEmpTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // API वरून डेटा आणून डॅशबोर्डवर दाखवणे
        fetch('http://localhost:9090/api/v1/employees')
            .then(res => res.json())
            .then(data => {
                document.getElementById('totalCount').innerText = data.length;
                let rows = "";
                // फक्त पहिले ५ कर्मचारी दाखवण्यासाठी
                data.slice(0, 5).forEach(emp => {
                    rows += `<tr>
                        <td>${emp.id || 'N/A'}</td>
                        <td>${emp.name}</td>
                        <td>${emp.email}</td>
                        <td><span style="color: green;">● Active</span></td>
                    </tr>`;
                });
                document.querySelector("#recentEmpTable tbody").innerHTML = rows;
            });
    </script>
</body>
</html>
