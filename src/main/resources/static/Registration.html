<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { width: 350px; padding: 30px; background: #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 12px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2196F3; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1976D2; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #2196F3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Create Account</h2>
        
        <form id="registerForm">
            <input type="text" id="name" placeholder="Full Name" required />
            <input type="email" id="email" placeholder="Email" required />
            <input type="password" id="password" placeholder="Set Password (Phone No)" required />
            <button type="submit">Register</button>
        </form>

        <div class="login-link">
            <a href="login.html">Already have an account? Login</a>
        </div>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const userData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                phoneno: document.getElementById("password").value
            };

            // Calling your existing CREATE API
            fetch("http://localhost:9090/api/v1/employees", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(userData)
            })
            .then(res => {
                if (res.ok) {
                    alert("Registration Successful! Please Login.");
                    window.location.href = "login.html";
                } else {
                    alert("Registration Failed. Check if email already exists.");
                }
            })
            .catch(err => {
                console.error("Error:", err);
                alert("Server Error. Please check if Spring Boot is running.");
            });
        });
    </script>
</body>
</html>
