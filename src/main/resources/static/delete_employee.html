<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #f8f9fa; 
        }
        .confirm-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 450px; 
        }
        h2 { color: #d9534f; margin-top: 0; }
        p { margin-bottom: 30px; color: #666; line-height: 1.5; }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: bold;
            margin: 8px; 
            text-decoration: none; 
            display: inline-block; 
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-secondary { background-color: #95a5a6; color: white; }
    </style>
</head>
<body>

    <div class="confirm-box">
        <h2>Are you sure?</h2>
        <p>Do you really want to delete this employee record? <br><strong>This action cannot be undone.</strong></p>
        
        <button id="confirmDelete" class="btn btn-danger">Yes, Delete Record</button>
        <a href="index.html" class="btn btn-secondary">No, Cancel</a>
    </div>

    <script>
        // 1. Extract the ID from the URL (e.g., delete-employee.html?id=101)
        const urlParams = new URLSearchParams(window.location.search);
        const empId = urlParams.get('id');

        document.getElementById("confirmDelete").addEventListener("click", function() {
            // Validation: Check if ID exists
            if (!empId) {
                alert("Error: No Employee ID provided in the URL.");
                return;
            }

            // 2. Perform the DELETE request
            // We use backticks (`) for template literals to inject the empId variable
            fetch(`http://localhost:9090/api/v1/employees/${empId}`, {
                method: 'DELETE'
            })
            .then(res => {
                if(res.ok) {
                    alert("Success: Employee record has been deleted.");
                    window.location.href = "index.html"; // Redirect back to the list
                } else {
                    alert("Failed to delete: Server returned status " + res.status);
                }
            })
            .catch(err => {
                console.error("Network Error:", err);
                alert("Connection Error: Please ensure your Backend server is running at localhost:9090");
            });
        });
    </script>
</body>
</html>
