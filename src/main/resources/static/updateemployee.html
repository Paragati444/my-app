<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Employee</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; padding: 50px; display: flex; justify-content: center; }
        .form-container { background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0px 8px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { font-size: 14px; color: #666; font-weight: bold; }
        input { width: 100%; padding: 12px; margin: 8px 0 20px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        .back-link { display: block; text-align: center; margin-top: 15px; text-decoration: none; color: #7f8c8d; font-size: 14px; }
        .back-link:hover { color: #34495e; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Update Employee</h2>
    <form id="updateForm">
        <input type="hidden" id="empId">
        
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name" required>
        
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter Email" required>
        
        <label for="phoneno">Phone Number</label>
        <input type="text" id="phoneno" placeholder="Enter Phone Number" required>
        
        <button type="submit">Save Changes</button>
    </form>
    
    <a href="index.html" class="back-link">← Back to Employee List</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    // 1. Fetch existing data to pre-fill the form
    if (id) {
        fetch(`http://localhost:9090/api/v1/employees/${id}`)
            .then(res => {
                if (!res.ok) throw new Error("Employee not found");
                return res.json();
            })
            .then(data => {
                document.getElementById('empId').value = data.id;
                document.getElementById('name').value = data.name;
                document.getElementById('email').value = data.email;
                document.getElementById('phoneno').value = data.phoneno;
            })
            .catch(err => {
                console.error(err);
                alert("Error: Could not load employee details.");
            });
    } else {
        alert("No ID provided!");
    }

    // 2. Submit Updated Data (PUT request)
    document.getElementById("updateForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const updatedData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phoneno: document.getElementById('phoneno').value
        };

        fetch(`http://localhost:9090/api/v1/employees/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        })
        .then(res => {
            if (res.ok) {
                alert("Employee Updated Successfully!");
                window.location.href = "index.html";
            } else {
                alert("Failed to update. Check backend logs.");
            }
        })
        .catch(err => {
            console.error("Error:", err);
            alert("Connection lost. Is the server running?");
        });
    });
</script>
</body>
</html>
